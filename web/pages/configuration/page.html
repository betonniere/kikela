<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Configuration</title>
    <style>
:root {
  --bg-color: #1e1e2e;
  --container-bg: #252538;
  --border-color: #3f3f56;
  --text-color: #cdd6f4;
  --text-muted: #a6adc8;
  --primary: #cba6f7;
  --primary-hover: #b4befe;
  --danger: #f38ba8;
  --danger-hover: #e05f80;
  --success: #a6e3a1;
  --info: #89b4fa;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  margin: 0;
  padding: 20px;
  display: flex;
  justify-content: center;
}

.app-container {
  width: 100%;
  max-width: 1100px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.panel {
  background-color: var(--container-bg);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
  display: flex;
  flex-direction: column;
}

h2 {
  margin-top: 0;
  margin-bottom: 20px;
  font-size: 1.4rem;
  border-bottom: 2px solid var(--border-color);
  padding-bottom: 10px;
  color: var(--text-color);
  letter-spacing: 0.3px;
}

.form-group {
  margin-bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

label {
  font-weight: 600;
  font-size: 0.9rem;
}

input[type="text"], input[type="number"] {
  background-color: var(--bg-color);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  padding: 10px;
  color: var(--text-color);
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.2s;
  box-sizing: border-box;
  min-width: 0;
}

input[type="text"]:focus, input[type="number"]:focus {
  border-color: var(--primary);
}

.checkbox-group {
  flex-direction: row;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}

.checkbox-group input {
  width: 18px;
  height: 18px;
  accent-color: var(--primary);
  cursor: pointer;
}

/* Sous-sections (Hubs / Smartphones) */
.subsection {
  padding-left: 14px;
  margin-bottom: 8px;
  border-radius: 2px;
}

.section-header {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  margin-top: 20px;
  margin-bottom: 12px;
  gap: 8px;
}

.section-title {
  font-size: 1.1rem;
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn {
  background-color: var(--primary);
  color: #11111b;
  border: none;
  border-radius: 6px;
  padding: 8px 14px;
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
  transition: background-color 0.2s, transform 0.1s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn:hover {
  background-color: var(--primary-hover);
}

.btn:active {
  transform: scale(0.98);
}

.btn-smartphone {
  background-color: var(--info);
  color: #11111b;
}

.btn-smartphone:hover {
  filter: brightness(1.1);
}

.btn-danger {
  background-color: var(--border-color);
  color: var(--text-color);
}

.btn-danger:hover {
  background-color: var(--danger);
  color: #11111b;
}

.dynamic-item {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-bottom: 10px;
  background-color: rgba(255, 255, 255, 0.03);
  padding: 8px;
  border-radius: 8px;
  border: 1px dashed var(--border-color);
  border-left: 3px solid var(--primary);
}

.dynamic-item input[data-role="hub-value"] {
  min-width: 0;
  flex-basis: 100px;
}

.smartphone-card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  background-color: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-color);
  border-left: 3px solid var(--info);
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 12px;
  position: relative;
}

.smartphone-card .card-header {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  gap: 8px;
}

.smartphone-card .card-header .phone-name {
  flex: 1 1 120px;
  min-width: 0;
}

.smartphone-card .grid-3 {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 10px;
}

@media (max-width: 500px) {
  .smartphone-card .grid-3 {
    grid-template-columns: 1fr;
  }
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 999px;
  background-color: rgba(255, 255, 255, 0.06);
  color: var(--text-muted);
  border: 1px solid var(--border-color);
  white-space: nowrap;
}

.status-badge.status-on {
  color: #11111b;
  background-color: var(--success);
  border-color: var(--success);
}

.status-badge.status-off {
  color: var(--text-color);
  background-color: rgba(243, 139, 168, 0.15);
  border-color: var(--danger);
}
    </style>
  </head>

  <body>

    <div class="app-container">
      <div class="panel">
        <h2>Configuration Générale</h2>

        <div class="subsection subsection-hubs">
          <div class="section-header">
            <span class="section-title">🖥️ Sync Modules</span>
            <button class="btn" id="add-hub-btn">+ Ajouter</button>
          </div>
          <div id="hubs-container"></div>
        </div>

        <div class="subsection subsection-smartphones">
          <div class="section-header">
            <span class="section-title">📱 Smartphones</span>
            <button class="btn btn-smartphone" id="add-smartphone-btn">+ Ajouter</button>
          </div>
          <div id="smartphones-container"></div>
        </div>
      </div>
    </div>

  </body>
</html>
