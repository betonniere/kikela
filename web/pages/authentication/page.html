<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication</title>
    <style>
      :root {
        --bg-color: #1e1e2e;
        --container-bg: #252538;
        --border-color: #3f3f56;
        --text-color: #cdd6f4;
        --text-muted: #a6adc8;
        --primary: #cba6f7;
        --primary-hover: #b4befe;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
      }

      .panel {
        background-color: var(--container-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
      }

      h1 {
        margin-top: 0;
        margin-bottom: 20px;
        font-size: 1.4rem;
        border-bottom: 2px solid var(--border-color);
        padding-bottom: 10px;
        color: var(--text-color);
        letter-spacing: 0.3px;
      }

      .form-group {
        margin-bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      label {
        font-weight: 600;
        font-size: 0.9rem;
      }

      input[type="text"], input#code {
        background-color: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 10px;
        color: var(--text-color);
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s;
        width: 100%;
        box-sizing: border-box;
      }

      input[type="text"]:focus, input#code:focus {
        border-color: var(--primary);
      }

      .btn {
        background-color: var(--primary);
        color: #11111b;
        border: none;
        border-radius: 6px;
        padding: 10px 14px;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        margin-top: 10px;
      }

      .btn:hover {
        background-color: var(--primary-hover);
      }

      .btn:active {
        transform: scale(0.98);
      }

      #result {
        margin-top: 16px;
        font-size: 0.9rem;
        color: var(--text-muted);
        text-align: center;
      }
    </style>
  </head>

  <body>

    <div class="panel">
      <h1>Authentification SMS</h1>
      <form id="form">
        <div class="form-group">
          <label for="code">Code reçu par SMS :</label>
          <input name="code" id="code" autocomplete="one-time-code" inputmode="numeric" autofocus>
        </div>
        <button type="submit" class="btn">Envoyer</button>
      </form>
      <p id="result"><b></b></p>
    </div>

  </body>
</html>
